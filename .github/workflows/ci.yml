name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall app.py tests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -v
  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Bandit report (toutes sévérités, ne bloque pas)
        run: bandit -r app.py -f json -o bandit-report.json --exit-zero
      - name: Bandit gate (bloque si HIGH)
        run: bandit -r app.py --severity-level high
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sca:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit report (ne bloque pas)
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
      - name: pip-audit gate (bloque si vulnérabilité connue)
        run: pip-audit -r requirements.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
  dast:
    runs-on: ubuntu-latest
    needs: [test, sast, sca]
    env:
      ZAP_FAIL_LEVEL: "1"   # 3 = High, 2 = Medium, 1 = Low
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Start ephemeral app
        run: |
          docker run -d --name demo-app -p 5000:5000 demo-app:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs demo-app
          exit 1

      - name: ZAP full scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host \
            -v "$(pwd)/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:5000 -m 2 -I \
            -r zap-report.html -J zap-report.json

      - name: Gate (échoue selon le niveau de risque)
        run: |
          python3 - <<'EOF'
          import json, os, sys
          threshold = int(os.environ["ZAP_FAIL_LEVEL"])
          data = json.load(open("zap-out/zap-report.json"))
          bad = [(a["riskdesc"], a["name"])
                 for s in data.get("site", [])
                 for a in s.get("alerts", [])
                 if int(a["riskcode"]) >= threshold]
          for risk, name in bad:
              print(f"ALERTE: {risk} - {name}")
          print(f"{len(bad)} alerte(s) >= niveau {threshold}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/

      - name: Destroy ephemeral env
        if: always()
        run: docker rm -f demo-app